[project]
name = "standard-asr-live"
version = "0.1.0"
description = "Live streaming speech-to-text in the terminal, with real-time corrections, against any Standard ASR engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Standard Voice Contributors" }]
keywords = ["asr", "speech-to-text", "streaming", "captions", "standard-asr", "terminal", "tui"]

# Engine-agnostic by construction: we depend ONLY on the protocol (standard-asr)
# plus our UI / audio libraries. We never depend on a concrete ASR engine.
dependencies = [
    "standard-asr>=0.1.1",
    "rich>=13.7",
    # Microphone capture. sounddevice wheels bundle PortAudio, so the live mic
    # (this app's centerpiece) works out of the box; audio_io still imports it
    # lazily so file mode keeps working if the backend cannot load at runtime.
    "sounddevice>=0.4.6",
]

# No engine plugins are declared as dependencies or extras — on purpose. This app
# depends ONLY on the protocol (`standard-asr`); it never imports or bundles a
# concrete engine. To get a working engine, install ANY Standard ASR-compliant
# plugin into the same environment (see the README) and it is discovered via entry
# points. That is the whole point: the application does not know, and does not need
# to know, which ASR engine it is talking to.

[project.scripts]
standard-asr-live = "standard_asr_live.cli:main"

# `standard-asr` is the published protocol package from PyPI (the `[project]`
# dependency above), so this app installs standalone with a plain `uv sync` — no
# co-located monorepo checkout required. The only local source is the in-repo
# scripted test-double engine used by the test suite. Engine plugins are
# intentionally NOT listed here: the app depends on no engine; install any
# compliant plugin yourself (see the README) and it is discovered via entry points.
[tool.uv.sources]
# The scripted test-double engine, discovered via entry points in the test suite.
std-scripted-asr = { path = "tests/scripted_engine", editable = true }

[build-system]
requires = ["uv-build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "standard_asr_live"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6",
    # The scripted test-double engine, so `uv sync` makes "scripted/demo"
    # discoverable for the entry-point / driver / CLI integration tests.
    "std-scripted-asr",
]

[tool.pytest.ini_options]
addopts = [
    "-q",
    "--cov=standard_asr_live",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]
testpaths = ["tests"]
# The scripted test-double engine is an installable sub-package, not a test
# module; don't let pytest recurse into it (its src/ layout would shadow imports).
norecursedirs = ["tests/scripted_engine"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["standard_asr_live"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "NPY201"]
